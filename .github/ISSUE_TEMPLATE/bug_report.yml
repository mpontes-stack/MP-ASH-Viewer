name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not paste passwords, hostnames, client names or other private data**
        (screenshots too: mask them before attaching).
  - type: input
    id: version
    attributes:
      label: MP-ASH-Viewer version
      description: Shown in the window title and in About
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: "Oracle 19c SE2, PDB / PostgreSQL 15 on RDS"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Connection profile
      options: [OracleSE, OracleEE, Postgres, Other]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Java version and operating system
      placeholder: "OpenJDK 21, Ubuntu 24.04"
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Steps to reproduce, the tab you were on, screenshots (masked)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error messages
      description: Terminal output of exec_ashv.sh / exec_ashv.bat, if any
      render: text
